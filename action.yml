name: notify
description: Отправить типизированное Telegram-уведомление (форум-тема + при необходимости incidents/команда)
author: mikitasazan

inputs:
  event:
    description: Тип события — deploy, job, report, ci, pr, incident, heartbeat_miss
    required: true
  project:
    description: playhub, one-q, arvent или game-publisher
    required: true
  status:
    description: 'ok/fail (для deploy, job, ci) — обычно ${{ job.status }}, success/failure маппится автоматически'
    required: false
  commit:
    required: false
  url:
    required: false
  target:
    required: false
  job-name:
    description: Имя задачи (для job/heartbeat_miss) — CLI-флаг --job
    required: false
  note:
    required: false
  title:
    required: false
  period:
    required: false
  branch:
    description: 'По умолчанию — ${{ github.ref_name }}'
    required: false
  actor:
    description: 'По умолчанию — ${{ github.actor }}'
    required: false
  action:
    description: opened/review_requested/merged (для pr)
    required: false
  number:
    required: false
  author:
    required: false
  reviewer:
    required: false
  detail:
    required: false
  stats:
    description: 'Цифры для job — по строке на «метка=значение» (многострочный вход)'
    required: false
  lines:
    description: 'Цифры для report — по строке на «метка=значение» (многострочный вход)'
    required: false
  items:
    description: 'Позиции списка — по строке на «текст» или «текст|ссылка» (многострочный вход)'
    required: false

runs:
  using: composite
  steps:
    # Node 24 из кеша раннера, ~1с. Нативно исполняет .ts без сборки —
    # зависимостей у пакета нет, ставить нечего.
    - uses: actions/setup-node@v4
      with:
        node-version: 24

    # ВСЕ входы приходят ТОЛЬКО через env, никогда через ${{ }} внутри run.
    # Причина не стилистическая: GitHub подставляет ${{ }} в текст скрипта ДО
    # запуска bash. Коммит с апострофом («don't crash») ломал шаг синтаксической
    # ошибкой, а `$(...)` в заголовке PR выполнялся бы на раннере — там, где
    # лежит OPS_BOT_TOKEN. Через env значения остаются данными.
    - shell: bash
      env:
        IN_EVENT: ${{ inputs.event }}
        IN_PROJECT: ${{ inputs.project }}
        IN_STATUS: ${{ inputs.status }}
        IN_COMMIT: ${{ inputs.commit }}
        IN_URL: ${{ inputs.url }}
        IN_TARGET: ${{ inputs.target }}
        IN_JOB: ${{ inputs.job-name }}
        IN_NOTE: ${{ inputs.note }}
        IN_TITLE: ${{ inputs.title }}
        IN_PERIOD: ${{ inputs.period }}
        IN_ACTION: ${{ inputs.action }}
        IN_NUMBER: ${{ inputs.number }}
        IN_AUTHOR: ${{ inputs.author }}
        IN_REVIEWER: ${{ inputs.reviewer }}
        IN_DETAIL: ${{ inputs.detail }}
        IN_STATS: ${{ inputs.stats }}
        IN_LINES: ${{ inputs.lines }}
        IN_ITEMS: ${{ inputs.items }}
        IN_BRANCH: ${{ inputs.branch }}
        IN_ACTOR: ${{ inputs.actor }}
        GH_REF_NAME: ${{ github.ref_name }}
        GH_ACTOR: ${{ github.actor }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -uo pipefail

        ARGS=(--project "$IN_PROJECT")

        # job.status отдаёт success/failure — приводим к ok/fail, которые
        # понимает пакет. Нормализация здесь дублирует CLI намеренно: так
        # `status: ${{ job.status }}` работает без обёрток в каждом workflow.
        if [ -n "$IN_STATUS" ]; then
          case "$IN_STATUS" in
            success|ok) ARGS+=(--status ok) ;;
            *)          ARGS+=(--status fail) ;;
          esac
        fi

        add() { [ -n "$2" ] && ARGS+=("$1" "$2"); return 0; }
        add --commit   "$IN_COMMIT"
        add --url      "$IN_URL"
        add --target   "$IN_TARGET"
        add --job      "$IN_JOB"
        add --note     "$IN_NOTE"
        add --title    "$IN_TITLE"
        add --period   "$IN_PERIOD"
        add --action   "$IN_ACTION"
        add --number   "$IN_NUMBER"
        add --author   "$IN_AUTHOR"
        add --reviewer "$IN_REVIEWER"
        add --detail   "$IN_DETAIL"

        # Многострочные входы: по строке на значение. Раньше здесь читался
        # `inputs.stats`, которого НЕ БЫЛО в объявлении входов выше — значит он
        # всегда приходил пустым, а вызывающий workflow вдобавок получал
        # предупреждение «Unexpected input». Через action нельзя было послать ни
        # job с цифрами, ни report вообще (у него все данные в --line).
        repeat() { # $1 = флаг, $2 = многострочное значение
          while IFS= read -r line; do
            [ -n "$line" ] && ARGS+=("$1" "$line")
          done <<< "$2"
          return 0
        }
        repeat --stat "$IN_STATS"
        repeat --line "$IN_LINES"
        repeat --item "$IN_ITEMS"

        if [ "$IN_EVENT" = "ci" ]; then
          ARGS+=(--branch "${IN_BRANCH:-$GH_REF_NAME}" --actor "${IN_ACTOR:-$GH_ACTOR}")
        fi

        OUT=$(node "$ACTION_PATH/src/cli.ts" "$IN_EVENT" "${ARGS[@]}" 2>&1) || true
        printf '%s\n' "$OUT"

        # Молчаливо потерянное уведомление — худший исход: workflow зелёный,
        # а сообщения нет. Жёлтая аннотация видна в UI и не валит прогон.
        case "$OUT" in
          *failed*|*skipped*) echo "::warning::уведомление не доставлено: $OUT" ;;
        esac
