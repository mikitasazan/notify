# Пакет раскатывается на все проекты сразу: сломанный рендер или разбор
# аргументов проявится не здесь, а на боевом уведомлении о падении деплоя —
# то есть ровно тогда, когда уведомление нужнее всего. Поэтому проверка
# гоняется на каждый push.
#
# Минуты: репозиторий публичный, значит Actions для него бесплатны и общий
# лимит аккаунта не тратят. Прогон — меньше минуты, зависимостей нет.
name: ci

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Только devDependencies (typescript + @types/node) — рантайм-зависимостей
      # у пакета нет и не должно появиться.
      - run: npm ci

      - name: Типы
        run: npm run typecheck

      - name: Тесты
        run: npm test

      # Сборка обязана проходить: в npm уезжает только `dist/`, его собирает
      # `prepare` при упаковке. Сломанная сборка = пустой пакет в реестре.
      - name: Сборка
        run: npm run build

      # Проверка, что собранный CLI действительно запускается. Без токена он
      # обязан вернуть 'skipped' и код 0 — это контракт: уведомление не имеет
      # права уронить вызвавшую его задачу.
      - name: CLI не падает без токена
        run: |
          OUT=$(node dist/cli.js job --project playhub --job тест --status ok 2>&1)
          echo "$OUT"
          echo "$OUT" | grep -q skipped || { echo "ожидали skipped"; exit 1; }

      - name: CLI не падает на неизвестном проекте
        run: |
          node dist/cli.js deploy --project несуществующий --status ok
          echo "код возврата $? — обязан быть 0"

      # Политика «одна новость — одна карточка» держится одной строкой белого
      # списка в ops-notify.yml, и вернуть в неё лишнее — правка на одно слово.
      # Проверка сторожит именно это: рендерер такие действия РИСОВАТЬ умеет,
      # поэтому возврат ничего не сломает и пройдёт незамеченным — просто про
      # каждый PR снова начнут приходить три сообщения вместо одного.
      - name: Политика Ops — объявленный PR не объявляется второй раз
        run: |
          LINE=$(grep -o 'pr:opened[^)]*' .github/workflows/ops-notify.yml)
          echo "белый список: $LINE"
          for a in ready_for_review review_requested reopened review_request_removed; do
            if echo "$LINE" | grep -q "pr:$a"; then
              echo "«$a» вернулось в белый список — это второе сообщение про уже объявленный PR"
              exit 1
            fi
          done
